<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outsy Concierge | Discover Local Pakistan</title>
    
    <!-- Sophisticated, modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* ==========================================
           Core Brilliant Dark Tech Theme
           ========================================== */
        :root {
            --bg-color: #121212; /* Deep Charcoal */
            --bg-accent: #1e1e1e;
            --primary-gradient: linear-gradient(135deg, #0d47a1 0%, #8e24aa 50%, #d81b60 100%);
            --primary-stop-1: #0d47a1;
            --primary-stop-2: #8e24aa;
            --primary-stop-3: #d81b60;
            --primary-glow: rgba(142, 36, 170, 0.4);
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --whatsapp-color: #25D366;
            --whatsapp-hover: #1da851;
            --bot-bubble-bg: #2c2c2c;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        /* ==========================================
           Animations
           ========================================== */
        @keyframes pageFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes glowPulse { 0% { box-shadow: 0 0 5px var(--primary-glow); } 50% { box-shadow: 0 0 15px var(--primary-glow); } 100% { box-shadow: 0 0 5px var(--primary-glow); } }
        @keyframesThinkingDot { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        /* ==========================================
           Layout & Structure
           ========================================== */
        body {
            font-family: var(--font-main);
            display: flex;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            animation: pageFadeIn 0.8s ease-out;
            overflow: hidden; /* Prevent body scrolling */
        }

        #chat-container {
            width: 40%;
            display: flex;
            flex-direction: column;
            background: var(--bg-accent);
            box-shadow: 5px 0 20px rgba(0,0,0,0.3);
            z-index: 10;
        }

        #map-container {
            width: 60%;
            height: 100%;
        }
        #map { width: 100%; height: 100%; }

        /* ==========================================
           Chat UI Elements
           ========================================== */
        .chat-header {
            padding: 25px;
            background: var(--bg-accent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }
        .chat-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: gradientShift 6s linear infinite;
        }
        .chat-header p { margin: 8px 0 0; font-size: 0.9rem; color: var(--text-muted); }
        
        .chat-status { font-size: 0.8rem; color: #4caf50; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 5px; }
        .chat-status-dot { width: 8px; height: 8px; background-color: #4caf50; border-radius: 50%; }

        #messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Message Bubbles & Animations */
        .message-row { display: flex; width: 100%; animation: slideUpFade 0.4s ease-out; }
        .user-row { justify-content: flex-end; }
        .bot-row { justify-content: flex-start; }

        .message-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.98rem;
            line-height: 1.5;
            position: relative;
        }

        .user-bubble {
            background: var(--primary-gradient);
            background-size: 200% auto;
            animation: gradientShift 4s linear infinite;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot-bubble {
            background-color: var(--bot-bubble-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-bottom-left-radius: 6px;
        }

        /* Event Card Redesign */
        .event-card {
            background: var(--bg-accent);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .event-card:hover { transform: translateY(-5px); border-color: var(--primary-stop-2); }
        .event-card h4 { margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 700; color: white; }
        .event-card p { margin: 6px 0; font-size: 0.95rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        
        .card-icon { color: var(--primary-stop-2); font-size: 1.1rem; }

        /* WhatsApp Button styled professionally */
        .wa-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: var(--whatsapp-color);
            color: white;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }
        .wa-btn:hover { background: var(--whatsapp-hover); transform: scale(1.02); }

        /* Thinking Indicator */
        .thinking-bubble { padding: 10px 18px; display: flex; gap: 5px; }
        .thinking-dot {
            width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%;
            animation:ThinkingDot 1.4s infinite ease-in-out; animation-fill-mode: both;
        }
        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        /* ==========================================
           Input Area Design
           ========================================== */
        #input-area {
            display: flex;
            padding: 20px;
            background: var(--bg-accent);
            border-top: 1px solid rgba(255,255,255,0.05);
            gap: 12px;
            position: relative;
        }
        #user-input {
            flex: 1;
            padding: 14px 20px;
            background: #2c2c2c;
            border: 1px solid transparent;
            border-radius: 30px;
            outline: none;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        #user-input:focus {
            border-color: var(--primary-stop-2);
            animation: glowPulse 2s infinite;
        }
        
        .send-btn {
            background: var(--primary-gradient);
            background-size: 200% auto;
            animation: gradientShift 3s linear infinite;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0 28px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .send-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
    </style>
</head>
<body>

    <!-- Left Side: Chat UI -->
    <div id="chat-container">
        <div class="chat-header">
            <h2>OUTSY</h2>
            <p>Your brilliant guide to local youth fun.</p>
            <div class="chat-status">
                <span class="chat-status-dot"></span>
                <span>Active Concierge</span>
            </div>
        </div>
        
        <div id="messages">
            <!-- Initial Bot Message -->
            <div class="message-row bot-row">
                <div class="message-bubble bot-bubble">
                    Hey! Looking for an indoor activity in Lahore today? Tell me what you're in the mood for, like "I want to go bowling."
                </div>
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your mood..." onkeypress="handleEnter(event)" />
            <button class="send-btn" onclick="handleUserMessage()">Find</button>
        </div>
    </div>

    <!-- Right Side: Map Container -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
